{% extends 'admin_base.html' %}
{% block title %}Site Settings - Admin{% endblock %}

{% block admin_content %}
<div class="admin-header">
    <h1>⚙️ Site Settings</h1>
</div>

<form method="POST" action="{{ url_for('manage_settings') }}">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start;">

        <!-- Business Details -->
        <div class="admin-panel">
            <div class="admin-panel-header">
                <h3>🏪 Business Details</h3>
            </div>
            <div class="admin-panel-body">
                <div class="form-group">
                    <label>Studio Name</label>
                    <input type="text" name="studio_name" class="form-control" value="{{ settings.get('studio_name', '') }}" placeholder="JMD Makeover Studio & Academy">
                </div>
                <div class="form-group">
                    <label>Tagline</label>
                    <input type="text" name="tagline" class="form-control" value="{{ settings.get('tagline', '') }}" placeholder="Premium Beauty & Makeover Services">
                </div>
                <div class="form-group">
                    <label>About Text</label>
                    <textarea name="about_text" class="form-control" placeholder="Brief description of your studio...">{{ settings.get('about_text', '') }}</textarea>
                </div>
                <div class="form-group">
                    <label>Full Address</label>
                    <textarea name="address" class="form-control" style="min-height: 60px;">{{ settings.get('address', '') }}</textarea>
                </div>
                <div class="form-group">
                    <label>Working Hours</label>
                    <input type="text" name="working_hours" class="form-control" value="{{ settings.get('working_hours', '') }}" placeholder="Mon-Sat: 10AM - 8PM | Sunday: Closed">
                </div>
            </div>
        </div>

        <!-- Contact & Social -->
        <div>
            <div class="admin-panel">
                <div class="admin-panel-header">
                    <h3>📞 Contact Information</h3>
                </div>
                <div class="admin-panel-body">
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" name="phone" class="form-control" value="{{ settings.get('phone', '') }}" placeholder="+91 98765 43210">
                    </div>
                    <div class="form-group">
                        <label>WhatsApp Number</label>
                        <input type="text" name="whatsapp" class="form-control" value="{{ settings.get('whatsapp', '') }}" placeholder="+91 98765 43210">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" class="form-control" value="{{ settings.get('email', '') }}" placeholder="info@jmdstudio.com">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Admin Email</label>
                            <input type="email" name="admin_email" class="form-control" value="{{ settings.get('admin_email', '') }}">
                        </div>
                        <div class="form-group">
                            <label>Admin Phone</label>
                            <input type="text" name="admin_phone" class="form-control" value="{{ settings.get('admin_phone', '') }}">
                        </div>
                    </div>
                </div>
            </div>

            <div class="admin-panel mt-2">
                <div class="admin-panel-header">
                    <h3>🔗 Social Media Links</h3>
                </div>
                <div class="admin-panel-body">
                    <div class="form-group">
                        <label>Instagram</label>
                        <input type="url" name="instagram" class="form-control" value="{{ settings.get('instagram', '') }}" placeholder="https://instagram.com/jmdstudio">
                    </div>
                    <div class="form-group">
                        <label>Facebook</label>
                        <input type="url" name="facebook" class="form-control" value="{{ settings.get('facebook', '') }}" placeholder="https://facebook.com/jmdstudio">
                    </div>
                    <div class="form-group">
                        <label>YouTube</label>
                        <input type="url" name="youtube" class="form-control" value="{{ settings.get('youtube', '') }}" placeholder="https://youtube.com/@jmdstudio">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div style="margin-top: 24px; text-align: right;">
        <button type="submit" class="btn btn-primary" style="padding: 14px 48px;">💾 Save All Settings</button>
    </div>
</form>

<style>
@media (max-width: 768px) {
    form > div:first-child {
        grid-template-columns: 1fr !important;
    }
}
</style>
{% endblock %}
